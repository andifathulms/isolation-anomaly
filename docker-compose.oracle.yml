# Development only. Never runs in CI, never ships in the bundle.
# `pnpm oracle:record` brings these up, executes every library schedule against
# them, and commits what they did as fixtures under tests/oracle/.
#
# The only non-default settings are ones that affect timing, not semantics:
# a short deadlock_timeout so detection happens inside the harness's wait
# window, and fsync off because these databases are thrown away.
name: isolation-anomaly-oracle

services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - deadlock_timeout=300ms
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_PASSWORD: oracle
      POSTGRES_DB: oracle
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d oracle']
      interval: 1s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    command:
      - --innodb-deadlock-detect=ON
      - --innodb-lock-wait-timeout=50
      - --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: oracle
      MYSQL_DATABASE: oracle
    ports:
      - '55336:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -poracle --silent']
      interval: 2s
      timeout: 5s
      retries: 40

  # amd64 only: there is no arm64 build of this image, so on Apple Silicon it
  # runs under emulation. The binary and its semantics are unchanged; only the
  # instruction set is translated, and the recorded version string proves which
  # server answered.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: Oracle_harness1
      MSSQL_PID: Developer
    ports:
      - '55433:1433'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 20s

  # Native arm64 and amd64 builds, maintained by an Oracle engineer. Oracle Free
  # takes a couple of minutes to initialise the first time, hence the long
  # start_period; the healthcheck ships with the image.
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: Oracle_harness1
    ports:
      - '55521:1521'
    healthcheck:
      test: ['CMD-SHELL', 'healthcheck.sh']
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 60s
